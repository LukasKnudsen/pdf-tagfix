[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-tagfix"
version = "0.1.0"
description = "Retter tilgængelighedsfejl i PDF'er, der allerede har tags"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pikepdf>=10.13"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pdf-tagfix-tree = "pdf_tagfix.dump_tree:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
